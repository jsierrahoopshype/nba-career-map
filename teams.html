<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Teams | HoopsHype Career Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Design tokens mirrored from index.html (nba-polymarket palette). */
        :root {
            --page:#f5f5f7; --surface:#fff; --surface-hover:#f0f0f2; --border:#d1d1d6;
            --text:#1d1d1f; --text-secondary:#6e6e73; --accent:#3b82f6;
            --accent-dim:rgba(59,130,246,.15); --green:#1d8a40; --red:#d12c2c; --orange:#b26b00;
            --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--page); color:var(--text); line-height:1.5;
            -webkit-font-smoothing:antialiased;
        }
        a { color:inherit; text-decoration:none; }

        header {
            background:#fff; padding:14px 20px; position:sticky; top:0; z-index:100;
            box-shadow:0 2px 20px rgba(0,0,0,0.08);
        }
        .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:16px; }
        .logo-text { font-weight:700; font-size:16px; letter-spacing:-0.5px; text-transform:uppercase; }
        .nav { margin-left:auto; display:flex; align-items:center; gap:8px; }
        .nav a {
            padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600;
            color:var(--text-secondary); transition:all .15s ease;
        }
        .nav a:hover { background:var(--surface-hover); color:var(--text); }
        .nav a.active { color:var(--accent); background:var(--accent-dim); }

        main { max-width:1200px; margin:0 auto; padding:24px 20px 64px; }

        .page-title { font-size:24px; font-weight:700; letter-spacing:-0.5px; margin-bottom:4px; }
        .page-sub { color:var(--text-secondary); font-size:14px; margin-bottom:20px; }

        .back { display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary);
                font-size:14px; font-weight:600; margin-bottom:16px; }
        .back:hover { color:var(--text); }
        .detail-title { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
        .detail-sub { color:var(--text-secondary); font-size:14px; margin:2px 0 20px; font-family:var(--mono); }

        .section { margin-bottom:28px; }
        .section-h { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
                     color:var(--text-secondary); margin-bottom:12px; }

        /* timeline */
        .timeline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .tl-node { background:var(--surface); border:1px solid var(--border); border-radius:999px;
                   padding:6px 14px; font-size:13px; font-weight:600; }
        .tl-node.current { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
        .tl-node .yrs { font-family:var(--mono); color:var(--text-secondary); font-weight:400; margin-left:6px; }
        .tl-node.current .yrs { color:var(--accent); }
        .tl-arrow { color:var(--text-secondary); font-size:16px; }

        /* status badge */
        .status-badge { font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 8px;
            border-radius:6px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
        .status-badge.nba_active { color:var(--green); background:rgba(29,138,64,.12); }
        .status-badge.overseas_active { color:var(--accent); background:var(--accent-dim); }
        .status-badge.retired { color:var(--text-secondary); background:var(--surface-hover); }

        /* shared table styling (landing, alumni, active-elsewhere, club) */
        .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
        .tfilter {
            flex:1; min-width:180px; max-width:320px; padding:9px 12px; font-size:14px;
            font-family:inherit; border:2px solid var(--border); border-radius:8px; outline:none;
            background:var(--surface-hover);
        }
        .tfilter:focus { border-color:var(--accent); background:#fff; }
        .count { color:var(--text-secondary); font-size:13px; font-family:var(--mono); }
        .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch;
                      border:1px solid var(--border); border-radius:12px; background:var(--surface); }
        table { width:100%; border-collapse:collapse; font-size:14px; min-width:460px; }
        th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
        td.wrap { white-space:normal; }
        th {
            position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none;
            font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-secondary);
            font-weight:700;
        }
        th:hover { color:var(--text); }
        th .arrow { opacity:.4; font-size:10px; margin-left:4px; }
        th.sorted .arrow { opacity:1; color:var(--accent); }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover { background:var(--surface-hover); }
        td.mono { font-family:var(--mono); color:var(--text-secondary); }
        /* Entity links inside data rows: neutral at rest, accent on hover only
           (matches the reference site's .echip / .gs-item — no blue text in
           table content). Standalone nav links (.back) may stay accent-tinted. */
        a.link { color:inherit; text-decoration:none; font-weight:600; }
        a.link:hover { color:var(--accent); }
        a.cell-link { display:block; color:inherit; text-decoration:none; margin:-10px -14px; padding:10px 14px; }
        a.cell-link:hover { color:var(--accent); }
        a.cell-link.name { font-weight:600; }
        .fr-links a { color:inherit; }
        .fr-links a:hover { color:var(--accent); }
        .flag {
            display:inline-block; width:16px; height:12px; border-radius:2px;
            vertical-align:-1px; margin-right:5px; object-fit:cover;
            box-shadow:0 0 0 1px rgba(0,0,0,0.08);
        }
        .empty { padding:40px; text-align:center; color:var(--text-secondary); }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a class="logo-text" href="index.html">🏀 Career Map</a>
            <nav class="nav">
                <a href="index.html">Map</a>
                <a href="teams.html" class="active">Teams</a>
            </nav>
        </div>
    </header>
    <main id="app"><div class="empty">Loading teams…</div></main>

    <script src="flags.js"></script>
    <script>
        const STATUS_LABEL = { nba_active:'NBA', overseas_active:'Overseas', retired:'Retired' };
        const STATUS_RANK = { nba_active:0, overseas_active:1, retired:2 };
        let TEAMS = {};
        let NBA_SET = new Set();
        const eraToFranchise = {};      // era name -> current franchise
        const playerFranchises = {};    // player -> Set(franchise)
        const clubIndex = {};           // non-NBA club -> Map(player -> {player,status,country})

        const esc = s => String(s??'').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const startYear = y => { const m = String(y||'').match(/\d{4}/); return m?parseInt(m[0],10):0; };

        // href builders — all navigation uses real anchors, never onclick strings
        const teamHref   = n => '#team=' + encodeURIComponent(n);
        const clubHref   = n => '#club=' + encodeURIComponent(n);
        const playerHref = n => 'index.html#player=' + encodeURIComponent(n);
        const currentHref = n => NBA_SET.has(n) ? teamHref(n) : clubHref(n);

        async function load(){
            try {
                const res = await fetch('data/team_pages.json');
                TEAMS = (await res.json()).teams || {};
            } catch(e){
                document.getElementById('app').innerHTML = '<div class="empty">Could not load team data.</div>';
                return;
            }
            NBA_SET = new Set(Object.keys(TEAMS));
            buildIndexes();
            route();
        }

        function buildIndexes(){
            for (const [fr, t] of Object.entries(TEAMS)){
                for (const r of t.roster){
                    eraToFranchise[r.stint_team] = fr;
                    (playerFranchises[r.player] ??= new Set()).add(fr);
                }
                for (const a of (t.active_elsewhere||[])){
                    const club = a.current_team;
                    if (club && !NBA_SET.has(club)){   // a non-NBA club gets a #club view
                        (clubIndex[club] ??= new Map()).set(a.player,
                            { player:a.player, status:a.status, country:a.country });
                    }
                }
            }
        }

        function route(){
            const h = location.hash;
            let m;
            if ((m = h.match(/^#team=(.+)$/)) && TEAMS[decodeURIComponent(m[1])]) {
                renderTeam(TEAMS[decodeURIComponent(m[1])]);
            } else if ((m = h.match(/^#club=(.+)$/)) && clubIndex[decodeURIComponent(m[1])]) {
                renderClub(decodeURIComponent(m[1]));
            } else {
                renderLanding();
            }
            window.scrollTo(0,0);
        }

        /* ---- generic sortable table -----------------------------------------
           spec = { columns:[{label, sortVal(row), cell(row)->html, cls?}],
                    rows, sortKey(index), sortDir, filter?(row,q), filterPlaceholder? }
           Sorting is wired with addEventListener (function refs), not onclick
           attributes; every linking cell returns a real <a href>. */
        function mountTable(root, spec){
            const state = { key: spec.sortKey ?? 0, dir: spec.sortDir ?? 1, q:'' };
            const hasFilter = !!spec.filter;
            root.innerHTML = `
                ${hasFilter ? `<div class="toolbar">
                    <input class="tfilter" type="text" placeholder="${esc(spec.filterPlaceholder||'Filter…')}" autocomplete="off">
                    <span class="count"></span></div>` : `<div class="toolbar"><span class="count"></span></div>`}
                <div class="table-wrap"><table>
                    <thead><tr>${spec.columns.map((c,i)=>
                        `<th data-i="${i}">${esc(c.label)} <span class="arrow">▲</span></th>`).join('')}</tr></thead>
                    <tbody></tbody>
                </table></div>`;
            const tbody = root.querySelector('tbody');
            const countEl = root.querySelector('.count');
            const ths = [...root.querySelectorAll('th')];

            function draw(){
                const q = state.q.toLowerCase().trim();
                const rows = (q && hasFilter) ? spec.rows.filter(r=>spec.filter(r,q)) : spec.rows;
                const col = spec.columns[state.key];
                const sorted = rows.slice().sort((a,b)=>{
                    const av = col.sortVal(a), bv = col.sortVal(b);
                    if (av < bv) return -1*state.dir;
                    if (av > bv) return  1*state.dir;
                    return String(a.__k||'').localeCompare(String(b.__k||''));
                });
                tbody.innerHTML = sorted.map(r =>
                    `<tr>${spec.columns.map(c=>`<td class="${c.cls||''}">${c.cell(r)}</td>`).join('')}</tr>`
                ).join('') || `<tr><td class="empty" colspan="${spec.columns.length}">Nothing to show.</td></tr>`;
                countEl.textContent = `${sorted.length}${q?` of ${spec.rows.length}`:''} ${spec.unit||'rows'}`;
                ths.forEach((th,i)=>{
                    const on = i===state.key;
                    th.classList.toggle('sorted', on);
                    const ar = th.querySelector('.arrow');
                    if (ar) ar.textContent = on ? (state.dir>0?'▲':'▼') : '▲';
                });
            }
            ths.forEach((th,i)=> th.addEventListener('click', ()=>{
                state.dir = (state.key===i) ? -state.dir : 1;
                state.key = i; draw();
            }));
            if (hasFilter){
                root.querySelector('.tfilter').addEventListener('input', e=>{ state.q = e.target.value; draw(); });
            }
            draw();
        }

        /* ---- landing: sortable table of the 30 franchises -------------------- */
        function renderLanding(){
            const rows = Object.keys(TEAMS).sort().map(n=>{
                const t = TEAMS[n];
                return { __k:n, name:n, alumni:t.alumni_count, stints:t.roster_count,
                         eras:(t.relocations||[]).length };
            });
            document.getElementById('app').innerHTML = `
                <div class="page-title">NBA Franchises</div>
                <div class="page-sub">30 teams · every player who ever suited up, across all eras. Sort or pick a team.</div>
                <div id="tbl"></div>`;
            const link = (n, txt, cls) => `<a class="cell-link${cls?' '+cls:''}" href="${teamHref(n)}">${txt}</a>`;
            mountTable(document.getElementById('tbl'), {
                unit:'teams',
                rows,
                columns:[
                    { label:'Team',  sortVal:r=>r.name.toLowerCase(), cell:r=>link(r.name, esc(r.name), 'name') },
                    { label:'Alumni',sortVal:r=>r.alumni, cls:'mono', cell:r=>link(r.name, r.alumni) },
                    { label:'Stints',sortVal:r=>r.stints, cls:'mono', cell:r=>link(r.name, r.stints) },
                    { label:'Name-city eras', sortVal:r=>r.eras, cls:'mono',
                      cell:r=>link(r.name, r.eras>1?`${r.eras} eras`:'—') },
                ],
            });
        }

        /* ---- team detail: timeline + active-elsewhere table + alumni table --- */
        function renderTimeline(relocations){
            if (!relocations || !relocations.length) return '';
            const nodes = relocations.map(r=>{
                const span = r.start_year==null ? `until ${r.end_year??'present'}`
                            : `${r.start_year}–${r.end_year??'present'}`;
                return `<span class="tl-node${r.current?' current':''}">${esc(r.name)}<span class="yrs">${span}</span></span>`;
            }).join('<span class="tl-arrow">→</span>');
            return `<div class="section"><div class="section-h">Franchise history</div>
                <div class="timeline">${nodes}</div></div>`;
        }

        // shared cell renderers
        const playerCell = r => `<a class="link" href="${playerHref(r.player)}">${esc(r.player)}</a>`;
        // link a team/club name only when its page actually exists (an NBA
        // franchise, or a club that currently has active alumni); else plain text
        const teamCell = n => {
            if (!n) return '—';
            return (NBA_SET.has(n) || clubIndex[n])
                ? `<a class="link" href="${currentHref(n)}">${esc(n)}</a>` : esc(n);
        };
        const countryCell = c => c ? `${flagImg(c)}${esc(c)}` : '—';
        const statusCell = r => `<span class="status-badge ${r.status}">${STATUS_LABEL[r.status]||esc(r.status)}</span>`;

        function renderTeam(t){
            const relocSub = (t.relocations||[]).map(r=>r.name).join(' → ');
            const active = t.roster.filter(r => r.status!=='retired').map(r=>({ __k:r.player, ...r }));
            const retired = t.roster.filter(r => r.status==='retired').map(r=>({ __k:r.player, ...r }));
            document.getElementById('app').innerHTML = `
                <a class="back" href="teams.html">← All teams</a>
                <div class="detail-title">${esc(t.franchise)}</div>
                <div class="detail-sub">${t.alumni_count} alumni · ${t.roster_count} stints${relocSub?' · '+esc(relocSub):''}</div>
                ${renderTimeline(t.relocations)}
                <div class="section"><div class="section-h">Currently active (${active.length})</div><div id="acTbl"></div></div>
                <div class="section"><div class="section-h">Retired (${retired.length})</div><div id="reTbl"></div></div>`;

            // Table 1 — currently active alumni (NBA + overseas), where they are now
            mountTable(document.getElementById('acTbl'), {
                unit:'players', rows:active,
                filterPlaceholder:'Filter players…',
                filter:(r,q)=>r.player.toLowerCase().includes(q),
                columns:[
                    { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap', cell:playerCell },
                    { label:'Years', sortVal:r=>startYear(r.years), cls:'mono', cell:r=>esc(r.years) },
                    { label:'Current team', sortVal:r=>(r.current_team||'').toLowerCase(),
                      cell:r=>teamCell(r.current_team) },
                    { label:'Country', sortVal:r=>(r.current_country||'').toLowerCase(),
                      cell:r=>countryCell(r.current_country) },
                    { label:'Status', sortVal:r=>STATUS_RANK[r.status], cell:statusCell },
                ],
            });

            // Table 2 — retired alumni, with the final club of their career
            mountTable(document.getElementById('reTbl'), {
                unit:'players', rows:retired,
                filterPlaceholder:'Filter players…',
                filter:(r,q)=>r.player.toLowerCase().includes(q),
                columns:[
                    { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap', cell:playerCell },
                    { label:'Years', sortVal:r=>startYear(r.years), cls:'mono', cell:r=>esc(r.years) },
                    { label:'Last team', sortVal:r=>(r.current_team||'').toLowerCase(),
                      cell:r=>teamCell(r.current_team) },
                ],
            });
        }

        /* ---- club view: NBA alumni currently at a non-NBA club --------------- */
        function renderClub(club){
            const members = [...clubIndex[club].values()];
            const country = members.map(m=>m.country).find(Boolean) || '';
            const rows = members.map(m=>({
                __k:m.player, player:m.player, status:m.status,
                franchises:[...(playerFranchises[m.player]||[])].sort(),
            }));
            document.getElementById('app').innerHTML = `
                <a class="back" href="teams.html">← All teams</a>
                <div class="detail-title">${esc(club)}</div>
                <div class="detail-sub">${rows.length} NBA alumni currently here${country?' · '+esc(country):''}</div>
                <div class="section"><div class="section-h">Roster — NBA alumni</div><div id="clubTbl"></div></div>`;
            mountTable(document.getElementById('clubTbl'), {
                unit:'players', rows,
                columns:[
                    { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap',
                      cell:r=>`<a class="link" href="${playerHref(r.player)}">${esc(r.player)}</a>` },
                    { label:'Status', sortVal:r=>STATUS_RANK[r.status],
                      cell:r=>`<span class="status-badge ${r.status}">${STATUS_LABEL[r.status]||esc(r.status)}</span>` },
                    { label:'NBA franchises', sortVal:r=>r.franchises[0]?.toLowerCase()||'', cls:'wrap',
                      cell:r=>`<span class="fr-links">${r.franchises.map(f=>
                          `<a href="${teamHref(f)}">${esc(f)}</a>`).join(', ')||'—'}</span>` },
                ],
            });
        }

        window.addEventListener('hashchange', route);
        load();
    </script>
</body>
</html>
