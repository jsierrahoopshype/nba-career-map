name: Update NBA Career Database

# Schedule (all times UTC):
#   In-season  (October–June): daily at 08:00       -> incremental
#   Off-season (July–September): weekly Mondays 08:00 -> incremental
#   Monthly (1st of every month 09:00)              -> full_overseas
# Cron month/day-of-week fields express the seasonal split natively. The run
# step maps the monthly cron to the full_overseas mode (re-check ALL overseas
# players); all other scheduled runs use incremental.
on:
  schedule:
    - cron: "0 8 * 10,11,12,1,2,3,4,5,6 *"   # in-season: every day, Oct–Jun
    - cron: "0 8 * 7,8,9 1"                   # off-season: Mondays, Jul–Sep
    - cron: "0 9 1 * *"                       # monthly: full overseas re-check
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        type: choice
        default: incremental
        options:
          - incremental        # roster newcomers + dropped + all overseas + stale NBA
          - full               # refresh all active players (NBA + overseas)
          - full_overseas      # re-check ALL overseas_active players
          - single             # refresh one player (set 'player')
          - review             # resolve locations for teams_needing_review
      player:
        description: "Player name (only for mode=single)"
        type: string
        required: false
      max_requests:
        description: "Max Wikipedia requests this run"
        type: string
        default: "100"

concurrency:
  group: update-careers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run career update
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_PLAYER: ${{ github.event.inputs.player }}
          IN_MAX: ${{ github.event.inputs.max_requests }}
        run: |
          # Resolve the run mode: manual dispatch uses the chosen input; the
          # monthly cron runs full_overseas; every other schedule runs incremental.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${IN_MODE:-incremental}"
          elif [ "$SCHEDULE" = "0 9 1 * *" ]; then
            MODE="full_overseas"
          else
            MODE="incremental"
          fi
          echo "Resolved mode: $MODE (event=$EVENT_NAME schedule='$SCHEDULE')"
          python3 scripts/update_careers.py \
            --mode "$MODE" \
            --player "${IN_PLAYER:-}" \
            --max-requests "${IN_MAX:-100}" \
            --delay 1.0

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs nba_players_careers_READY.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MSG="$(cat logs/last_commit_message.txt 2>/dev/null || echo 'Auto-update career database')"
          git commit -m "$MSG"
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push failed, retry $i"; sleep $((2 ** i))
          done
