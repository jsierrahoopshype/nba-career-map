name: Player Birth/Death Facts

# Birth and death facts for every player in the career database
# (scripts/fetch_bio_wikidata.py -> data/players/player_bio.json), plus the
# human's queue that lands in data/players/bio_needs_review.json.
#
# The daily pipeline (update-careers.yml) already runs the incremental slice
# of this. THIS workflow is the by-hand one: the first full backfill of all
# ~5,200 players, a re-run after a Wikidata outage, or -- the reason to reach
# for it after the rules themselves change -- a "full" run, which re-reads
# every player and REWRITES every record from scratch under the current rules:
# the P106/P641 identity gate that keeps a namesake's dates out, the search
# that re-points a rejected player at the right item, and Basketball-Reference
# deciding the birth date.
#
# Manual only, on purpose: a full backfill is a few hundred API requests and
# wants a human deciding when it happens.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: incremental
        options:
          - incremental   # players missing from player_bio.json + weekly death re-checks
          - full          # re-read everyone and rewrite every record under the current rules
          - reapply       # offline: re-apply the rules to what is on file, no Wikidata
      limit:
        description: "Max players to resolve this run (blank = all)"
        type: string
        required: false
      refresh_limit:
        description: "Max living players re-checked for a death"
        type: string
        default: "1000"
      rebuild_pages:
        description: "Rebuild the prerendered pages afterwards"
        type: boolean
        default: true

# Shares the career pipeline's group: both commit to the same branch, so they
# queue instead of racing each other's pushes.
concurrency:
  group: update-careers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch birth/death facts
        # No continue-on-error here, unlike the daily pipeline: this run has
        # one job, so a Wikidata failure is the result and the run says so.
        env:
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_REFRESH: ${{ github.event.inputs.refresh_limit }}
        run: |
          ARGS="--refresh-limit ${IN_REFRESH:-1000} --delay 1.0"
          if [ "$IN_MODE" = "full" ]; then ARGS="$ARGS --full"; fi
          if [ "$IN_MODE" = "reapply" ]; then ARGS="$ARGS --reapply"; fi
          if [ -n "$IN_LIMIT" ]; then ARGS="$ARGS --limit $IN_LIMIT"; fi
          echo "python3 scripts/fetch_bio_wikidata.py $ARGS"
          python3 scripts/fetch_bio_wikidata.py $ARGS

      - name: Review summary
        # The counts land in the run's summary page, so the wrong-entity and
        # disagreement queues are visible without cloning the repo.
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/players/bio_needs_review.json")
          if not p.exists():
              print("No review file was written.")
              raise SystemExit
          r = json.loads(p.read_text(encoding="utf-8"))
          c = r.get("counts", {})
          print("## Birth/death review\n")
          for k in ("wrong_entity", "wrong_entity_replaced",
                    "date_disagreement", "still_missing",
                    "wikipedia_url_wrong_person"):
              print(f"- **{k.replace('_', ' ')}**: {c.get(k, 0)}")
          bad = r.get("wikipedia_url_wrong_person") or []
          if bad:
              print("\n### Wikipedia URLs pointing at the wrong person\n")
              for row in bad:
                  print(f"- {row['player']} — {row['wikipedia_url']}")
          PY

      - name: Rebuild derived data and pages
        # The Person JSON-LD on each player page is baked in at build time,
        # so the pages have to be rewritten for the new facts to reach a
        # crawler.
        if: ${{ github.event.inputs.rebuild_pages != 'false' }}
        run: python3 scripts/build_dashboard_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data sitemap.xml player team country assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          COUNT=$(python3 -c "import json,pathlib;d=json.loads(pathlib.Path('data/players/player_bio.json').read_text());print(sum(1 for r in d.values() if r.get('birth_date')))")
          git commit -m "Update player birth/death facts (${COUNT} with a birth date)"
          pushed=
          for i in 1 2 3 4; do
            if git push; then pushed=yes; break; fi
            echo "push failed, retry $i"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((2 ** i))
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push the bio update"
            exit 1
          fi
