<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Teams | HoopsHype Career Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Design tokens mirrored from index.html (nba-polymarket palette). */
        :root {
            --page:#f5f5f7; --surface:#fff; --surface-hover:#f0f0f2; --border:#d1d1d6;
            --text:#1d1d1f; --text-secondary:#6e6e73; --accent:#3b82f6;
            --accent-dim:rgba(59,130,246,.15); --green:#1d8a40; --red:#d12c2c; --orange:#b26b00;
            --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--page); color:var(--text); line-height:1.5;
            -webkit-font-smoothing:antialiased;
        }
        a { color:inherit; text-decoration:none; }

        header {
            background:#fff; padding:14px 20px; position:sticky; top:0; z-index:100;
            box-shadow:0 2px 20px rgba(0,0,0,0.08);
        }
        .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:16px; }
        .logo-text { font-weight:700; font-size:16px; letter-spacing:-0.5px; text-transform:uppercase; }
        .nav { margin-left:auto; display:flex; align-items:center; gap:8px; }
        .nav a {
            padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600;
            color:var(--text-secondary); transition:all .15s ease;
        }
        .nav a:hover { background:var(--surface-hover); color:var(--text); }
        .nav a.active { color:var(--accent); background:var(--accent-dim); }

        /* global player search (top in header, bottom in footer) */
        .search-wrap { position:relative; }
        .search-wrap.top { flex:1; max-width:280px; margin-left:auto; }
        .search-wrap.top + .nav { margin-left:12px; }
        .psearch {
            width:100%; padding:10px 14px; font-size:14px; font-family:inherit;
            border:2px solid var(--border); border-radius:8px; outline:none;
            background:var(--surface-hover); color:var(--text);
        }
        .psearch:focus { border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px var(--accent-dim); }
        .psearch::placeholder { color:var(--text-secondary); }
        .sresults {
            display:none; position:absolute; top:100%; left:0; right:0; z-index:200;
            background:var(--surface); border:1px solid var(--border); border-radius:0 0 8px 8px;
            border-top:none; max-height:300px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.1);
        }
        .sresults.show { display:block; }
        .sresult-item { padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border); }
        .sresult-item:last-child { border-bottom:none; }
        .sresult-item:hover, .sresult-item.active { background:var(--surface-hover); color:var(--accent); }
        .footer-search { max-width:520px; margin:48px auto 0; padding-top:28px; border-top:1px solid var(--border); }
        .footer-search .fs-label { font-size:13px; font-weight:700; text-transform:uppercase;
            letter-spacing:.4px; color:var(--text-secondary); text-align:center; margin-bottom:10px; }

        main { max-width:1200px; margin:0 auto; padding:24px 20px 64px; }

        .page-title { font-size:24px; font-weight:700; letter-spacing:-0.5px; margin-bottom:4px; }
        .page-sub { color:var(--text-secondary); font-size:14px; margin-bottom:20px; }

        .back { display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary);
                font-size:14px; font-weight:600; margin-bottom:16px; }
        .back:hover { color:var(--text); }
        .detail-title { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
        .detail-sub { color:var(--text-secondary); font-size:14px; margin:2px 0 20px; font-family:var(--mono); }

        .section { margin-bottom:28px; }
        .section-h { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
                     color:var(--text-secondary); margin-bottom:12px; }

        /* timeline */
        .timeline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .tl-node { background:var(--surface); border:1px solid var(--border); border-radius:999px;
                   padding:6px 14px; font-size:13px; font-weight:600; }
        .tl-node.current { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
        .tl-node .yrs { font-family:var(--mono); color:var(--text-secondary); font-weight:400; margin-left:6px; }
        .tl-node.current .yrs { color:var(--accent); }
        .tl-arrow { color:var(--text-secondary); font-size:16px; }

        /* status badge */
        .status-badge { font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 8px;
            border-radius:6px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
        .status-badge.nba_active { color:var(--green); background:rgba(29,138,64,.12); }
        .status-badge.overseas_active { color:var(--accent); background:var(--accent-dim); }
        .status-badge.retired { color:var(--text-secondary); background:var(--surface-hover); }

        /* related-teams suggestion chips */
        .related-chips { display:flex; flex-wrap:wrap; gap:8px; }
        .rel-chip {
            display:inline-flex; align-items:baseline; gap:8px; background:var(--surface);
            border:1px solid var(--border); border-radius:999px; padding:7px 14px;
            font-size:13px; color:inherit; transition:all .15s ease;
        }
        .rel-chip:hover { border-color:var(--accent); background:var(--surface-hover); color:var(--accent); }
        .rel-chip .rel-shared { font-family:var(--mono); font-size:11px; color:var(--text-secondary); }
        .rel-chip:hover .rel-shared { color:var(--accent); }
        .subtable-h { margin-top:36px; }

        /* shared table styling (landing, alumni, active-elsewhere, club) */
        .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
        .tfilter {
            flex:1; min-width:180px; max-width:320px; padding:9px 12px; font-size:14px;
            font-family:inherit; border:2px solid var(--border); border-radius:8px; outline:none;
            background:var(--surface-hover);
        }
        .tfilter:focus { border-color:var(--accent); background:#fff; }
        .count { color:var(--text-secondary); font-size:13px; font-family:var(--mono); }
        .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch;
                      border:1px solid var(--border); border-radius:12px; background:var(--surface); }
        table { width:100%; border-collapse:collapse; font-size:14px; min-width:460px; }
        th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
        td.wrap { white-space:normal; }
        th {
            position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none;
            font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-secondary);
            font-weight:700;
        }
        th:hover { color:var(--text); }
        th .arrow { opacity:.4; font-size:10px; margin-left:4px; }
        th.sorted .arrow { opacity:1; color:var(--accent); }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover { background:var(--surface-hover); }
        td.mono { font-family:var(--mono); color:var(--text-secondary); }
        /* Entity links inside data rows: neutral at rest, accent on hover only
           (matches the reference site's .echip / .gs-item — no blue text in
           table content). Standalone nav links (.back) may stay accent-tinted. */
        a.link { color:inherit; text-decoration:none; font-weight:600; }
        a.link:hover { color:var(--accent); }
        a.cell-link { display:block; color:inherit; text-decoration:none; margin:-10px -14px; padding:10px 14px; }
        a.cell-link:hover { color:var(--accent); }
        a.cell-link.name { font-weight:600; }
        .fr-links a { color:inherit; }
        .fr-links a:hover { color:var(--accent); }
        .flag {
            display:inline-block; width:16px; height:12px; border-radius:2px;
            vertical-align:-1px; margin-right:5px; object-fit:cover;
            box-shadow:0 0 0 1px rgba(0,0,0,0.08);
        }
        .empty { padding:40px; text-align:center; color:var(--text-secondary); }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a class="logo-text" href="index.html">🏀 Career Map</a>
            <div class="search-wrap top">
                <input class="psearch" id="topSearch" type="text" placeholder="Search 5,000+ players…" autocomplete="off">
                <div class="sresults" id="topResults"></div>
            </div>
            <nav class="nav">
                <a href="index.html">Map</a>
                <a href="teams.html" class="active">Teams</a>
            </nav>
        </div>
    </header>
    <main id="app"><div class="empty">Loading teams…</div></main>
    <div class="footer-search">
        <div class="fs-label">Search any player</div>
        <div class="search-wrap">
            <input class="psearch" id="botSearch" type="text" placeholder="Search 5,000+ players…" autocomplete="off">
            <div class="sresults" id="botResults"></div>
        </div>
    </div>

    <script src="flags.js"></script>
    <script>
        const STATUS_LABEL = { nba_active:'NBA', overseas_active:'Overseas', retired:'Retired' };
        const STATUS_RANK = { nba_active:0, overseas_active:1, retired:2 };
        let TEAMS = {};
        let CLUBS = {};                 // all-time club rosters (club_pages.json)
        let NBA_SET = new Set();
        let ALL_PLAYERS = [];           // every player name, for search
        const eraToFranchise = {};      // era name -> current franchise
        const playerFranchises = {};    // player -> Set(franchise)
        const clubIndex = {};           // non-NBA club -> Map(player -> {player,status,country})

        const esc = s => String(s??'').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const startYear = y => { const m = String(y||'').match(/\d{4}/); return m?parseInt(m[0],10):0; };

        // href builders — real query-param URLs; internal ones are same-document
        // (?team=/?club=) so they get SPA-intercepted into history.pushState.
        const teamHref   = n => '?team=' + encodeURIComponent(n);
        const clubHref   = n => '?club=' + encodeURIComponent(n);
        const playerHref = n => 'index.html?player=' + encodeURIComponent(n);
        // Every team resolves: NBA names (any era) -> franchise page, everything
        // else -> its club page (the all-time club index covers every club).
        const currentHref = n => (NBA_SET.has(n) || eraToFranchise[n]) ? teamHref(n) : clubHref(n);

        async function load(){
            try {
                const [tp, cp] = await Promise.all([
                    fetch('data/team_pages.json').then(r=>r.json()),
                    fetch('data/club_pages.json').then(r=>r.json()),
                ]);
                TEAMS = tp.teams || {};
                CLUBS = cp.clubs || {};
            } catch(e){
                document.getElementById('app').innerHTML = '<div class="empty">Could not load team data.</div>';
                return;
            }
            NBA_SET = new Set(Object.keys(TEAMS));
            buildIndexes();
            initSearch();
            redirectLegacyHash();
            window.addEventListener('popstate', route);
            document.addEventListener('click', interceptNav);
            route();
        }

        function buildIndexes(){
            const names = new Set();
            for (const [fr, t] of Object.entries(TEAMS)){
                for (const r of t.roster){
                    eraToFranchise[r.stint_team] = fr;
                    (playerFranchises[r.player] ??= new Set()).add(fr);
                    names.add(r.player);
                }
                for (const a of (t.active_elsewhere||[])){
                    const club = a.current_team;
                    if (club && !NBA_SET.has(club)){
                        (clubIndex[club] ??= new Map()).set(a.player,
                            { player:a.player, status:a.status, country:a.country });
                    }
                }
            }
            for (const c of Object.values(CLUBS))
                for (const r of c.roster) names.add(r.player);
            ALL_PLAYERS = [...names].sort();
        }

        const TITLE_SUFFIX = 'HoopsHype Career Map';
        function setTitle(t){ document.title = t; }

        // Rewrite legacy #team=/#club=/#player= links to the query form.
        function redirectLegacyHash(){
            const m = location.hash.match(/^#(team|club|player)=(.+)$/);
            if (!m) return;
            const val = decodeURIComponent(m[2]);
            if (m[1] === 'player'){
                location.replace('index.html?player=' + encodeURIComponent(val));
                return;
            }
            history.replaceState({}, '', '?' + m[1] + '=' + encodeURIComponent(val));
        }

        // SPA-intercept same-document query links -> history.pushState + route().
        function interceptNav(e){
            if (e.defaultPrevented || e.button!==0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            const a = e.target.closest('a');
            if (!a || a.target==='_blank') return;
            const u = new URL(a.href, location.href);
            if (u.origin!==location.origin || u.pathname!==location.pathname) return; // cross-doc: let it navigate
            e.preventDefault();
            if (u.href !== location.href){ history.pushState({}, '', u.href); route(); }
        }

        function route(){
            const p = new URLSearchParams(location.search);
            const teamParam = p.get('team');
            const clubParam = p.get('club');
            if (teamParam){
                const fr = TEAMS[teamParam] ? teamParam : eraToFranchise[teamParam];
                if (fr && TEAMS[fr]){
                    // canonicalize an era-name URL to the current franchise
                    if (teamParam !== fr) history.replaceState({}, '', '?team=' + encodeURIComponent(fr));
                    renderTeam(TEAMS[fr]);
                    return window.scrollTo(0,0);
                }
            }
            if (clubParam && (CLUBS[clubParam] || clubIndex[clubParam])){
                renderClub(clubParam);
                return window.scrollTo(0,0);
            }
            renderLanding();
            window.scrollTo(0,0);
        }

        /* ---- generic sortable table -----------------------------------------
           spec = { columns:[{label, sortVal(row), cell(row)->html, cls?}],
                    rows, sortKey(index), sortDir, filter?(row,q), filterPlaceholder? }
           Sorting is wired with addEventListener (function refs), not onclick
           attributes; every linking cell returns a real <a href>. */
        function mountTable(root, spec){
            const state = { key: spec.sortKey ?? 0, dir: spec.sortDir ?? 1, q:'' };
            const hasFilter = !!spec.filter;
            root.innerHTML = `
                ${hasFilter ? `<div class="toolbar">
                    <input class="tfilter" type="text" placeholder="${esc(spec.filterPlaceholder||'Filter…')}" autocomplete="off">
                    <span class="count"></span></div>` : `<div class="toolbar"><span class="count"></span></div>`}
                <div class="table-wrap"><table>
                    <thead><tr>${spec.columns.map((c,i)=>
                        `<th data-i="${i}">${esc(c.label)} <span class="arrow">▲</span></th>`).join('')}</tr></thead>
                    <tbody></tbody>
                </table></div>`;
            const tbody = root.querySelector('tbody');
            const countEl = root.querySelector('.count');
            const ths = [...root.querySelectorAll('th')];

            function draw(){
                const q = state.q.toLowerCase().trim();
                const rows = (q && hasFilter) ? spec.rows.filter(r=>spec.filter(r,q)) : spec.rows;
                const col = spec.columns[state.key];
                const sorted = rows.slice().sort((a,b)=>{
                    const av = col.sortVal(a), bv = col.sortVal(b);
                    if (av < bv) return -1*state.dir;
                    if (av > bv) return  1*state.dir;
                    return String(a.__k||'').localeCompare(String(b.__k||''));
                });
                tbody.innerHTML = sorted.map(r =>
                    `<tr>${spec.columns.map(c=>`<td class="${c.cls||''}">${c.cell(r)}</td>`).join('')}</tr>`
                ).join('') || `<tr><td class="empty" colspan="${spec.columns.length}">Nothing to show.</td></tr>`;
                countEl.textContent = `${sorted.length}${q?` of ${spec.rows.length}`:''} ${spec.unit||'rows'}`;
                ths.forEach((th,i)=>{
                    const on = i===state.key;
                    th.classList.toggle('sorted', on);
                    const ar = th.querySelector('.arrow');
                    if (ar) ar.textContent = on ? (state.dir>0?'▲':'▼') : '▲';
                });
            }
            ths.forEach((th,i)=> th.addEventListener('click', ()=>{
                state.dir = (state.key===i) ? -state.dir : 1;
                state.key = i; draw();
            }));
            if (hasFilter){
                root.querySelector('.tfilter').addEventListener('input', e=>{ state.q = e.target.value; draw(); });
            }
            draw();
        }

        /* ---- landing: sortable table of the 30 franchises -------------------- */
        function renderLanding(){
            setTitle('NBA Teams — All-Time Rosters | ' + TITLE_SUFFIX);
            const rows = Object.keys(TEAMS).sort().map(n=>{
                const t = TEAMS[n];
                return { __k:n, name:n, alumni:t.alumni_count, stints:t.roster_count,
                         eras:(t.relocations||[]).length };
            });
            // Top 100 non-NBA clubs by all-time alumni count, shown alphabetically.
            const topClubs = Object.values(CLUBS)
                .sort((a,b)=> (b.count||0)-(a.count||0) || a.club.localeCompare(b.club))
                .slice(0,100)
                .sort((a,b)=> a.club.localeCompare(b.club))
                .map(c=>({ __k:c.club, club:c.club, country:c.country||'', count:c.count||0 }));

            document.getElementById('app').innerHTML = `
                <div class="page-title">NBA Franchises</div>
                <div class="page-sub">30 teams · every player who ever suited up, across all eras. Sort or pick a team.</div>
                <div id="tbl"></div>
                <div class="section-h subtable-h">Top international &amp; minor-league clubs</div>
                <div class="page-sub">100 non-NBA clubs with the most all-time NBA alumni.</div>
                <div id="clubTbl"></div>`;
            const link = (n, txt, cls) => `<a class="cell-link${cls?' '+cls:''}" href="${teamHref(n)}">${txt}</a>`;
            mountTable(document.getElementById('tbl'), {
                unit:'teams',
                rows,
                columns:[
                    { label:'Team',  sortVal:r=>r.name.toLowerCase(), cell:r=>link(r.name, esc(r.name), 'name') },
                    { label:'Alumni',sortVal:r=>r.alumni, cls:'mono', cell:r=>link(r.name, r.alumni) },
                    { label:'Stints',sortVal:r=>r.stints, cls:'mono', cell:r=>link(r.name, r.stints) },
                    { label:'Name-city eras', sortVal:r=>r.eras, cls:'mono',
                      cell:r=>link(r.name, r.eras>1?`${r.eras} eras`:'—') },
                ],
            });
            const clink = (n, txt, cls) => `<a class="cell-link${cls?' '+cls:''}" href="${clubHref(n)}">${txt}</a>`;
            mountTable(document.getElementById('clubTbl'), {
                unit:'clubs',
                rows:topClubs,
                columns:[
                    { label:'Club', sortVal:r=>r.club.toLowerCase(), cls:'wrap', cell:r=>clink(r.club, esc(r.club), 'name') },
                    { label:'Country', sortVal:r=>r.country.toLowerCase(),
                      cell:r=>r.country ? clink(r.club, `${flagImg(r.country)}${esc(r.country)}`) : clink(r.club,'—') },
                    { label:'All-time NBA alumni', sortVal:r=>r.count, cls:'mono', cell:r=>clink(r.club, r.count) },
                ],
            });
        }

        /* ---- team detail: timeline + active-elsewhere table + alumni table --- */
        function renderTimeline(relocations){
            if (!relocations || !relocations.length) return '';
            const nodes = relocations.map(r=>{
                const span = r.start_year==null ? `until ${r.end_year??'present'}`
                            : `${r.start_year}–${r.end_year??'present'}`;
                return `<span class="tl-node${r.current?' current':''}">${esc(r.name)}<span class="yrs">${span}</span></span>`;
            }).join('<span class="tl-arrow">→</span>');
            return `<div class="section"><div class="section-h">Franchise history</div>
                <div class="timeline">${nodes}</div></div>`;
        }

        // shared cell renderers
        const playerCell = r => `<a class="link" href="${playerHref(r.player)}">${esc(r.player)}</a>`;
        // every team/club name links to its page (all clubs resolve now)
        const teamCell = n => n ? `<a class="link" href="${currentHref(n)}">${esc(n)}</a>` : '—';
        const countryCell = c => c ? `${flagImg(c)}${esc(c)}` : '—';
        const statusCell = r => `<span class="status-badge ${r.status}">${STATUS_LABEL[r.status]||esc(r.status)}</span>`;

        // Related-teams suggestions (precomputed in the data layer): chips that
        // link to each suggestion's team/club page.
        function renderRelated(related){
            if (!related || !related.length) return '';
            const chips = related.map(r=>{
                const href = r.type==='team' ? teamHref(r.name) : clubHref(r.name);
                const shared = r.shared ? `<span class="rel-shared">${r.shared} shared</span>` : '';
                return `<a class="rel-chip" href="${href}"><span class="rel-name">${esc(r.name)}</span>${shared}</a>`;
            }).join('');
            return `<div class="section"><div class="section-h">Related teams</div>
                <div class="related-chips">${chips}</div></div>`;
        }

        // Collapse per-stint roster rows into ONE row per player, joining their
        // year-spans (chronological) into a single comma-separated string.
        function groupByPlayer(rows){
            const by = new Map();
            for (const r of rows){
                const g = by.get(r.player);
                if (g) g.spans.push(r.years);
                else by.set(r.player, { ...r, __k:r.player, spans:[r.years] });
            }
            return [...by.values()].map(g => {
                g.spans.sort((a,b)=>startYear(a)-startYear(b));
                g.years = g.spans.filter(Boolean).join(', ');
                return g;
            });
        }

        function renderTeam(t){
            setTitle(`${t.franchise} All-Time NBA Players | ${TITLE_SUFFIX}`);
            const relocSub = (t.relocations||[]).map(r=>r.name).join(' → ');
            // one row per player (years-spans joined), not per stint
            const active = groupByPlayer(t.roster.filter(r => r.status!=='retired'));
            const retired = groupByPlayer(t.roster.filter(r => r.status==='retired'));
            document.getElementById('app').innerHTML = `
                <a class="back" href="teams.html">← All teams</a>
                <div class="detail-title">${esc(t.franchise)}</div>
                <div class="detail-sub">${t.alumni_count} alumni · ${t.roster_count} stints${relocSub?' · '+esc(relocSub):''}</div>
                ${renderTimeline(t.relocations)}
                <div class="section"><div class="section-h">Currently active (${active.length})</div><div id="acTbl"></div></div>
                <div class="section"><div class="section-h">Retired (${retired.length})</div><div id="reTbl"></div></div>
                ${renderRelated(t.related)}`;

            // Table 1 — currently active alumni (NBA + overseas), where they are now
            mountTable(document.getElementById('acTbl'), {
                unit:'players', rows:active,
                filterPlaceholder:'Filter players…',
                filter:(r,q)=>r.player.toLowerCase().includes(q),
                columns:[
                    { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap', cell:playerCell },
                    { label:'Years', sortVal:r=>startYear(r.years), cls:'mono', cell:r=>esc(r.years) },
                    { label:'Current team', sortVal:r=>(r.current_team||'').toLowerCase(),
                      cell:r=>teamCell(r.current_team) },
                    { label:'Country', sortVal:r=>(r.current_country||'').toLowerCase(),
                      cell:r=>countryCell(r.current_country) },
                    { label:'Status', sortVal:r=>STATUS_RANK[r.status], cell:statusCell },
                ],
            });

            // Table 2 — retired alumni: final club of their career + its country
            mountTable(document.getElementById('reTbl'), {
                unit:'players', rows:retired,
                filterPlaceholder:'Filter players…',
                filter:(r,q)=>r.player.toLowerCase().includes(q),
                columns:[
                    { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap', cell:playerCell },
                    { label:'Years', sortVal:r=>startYear(r.years), cls:'mono', cell:r=>esc(r.years) },
                    { label:'Last team', sortVal:r=>(r.current_team||'').toLowerCase(),
                      cell:r=>teamCell(r.current_team) },
                    { label:'Country', sortVal:r=>(r.current_country||'').toLowerCase(),
                      cell:r=>countryCell(r.current_country) },
                ],
            });
        }

        /* ---- club view: a non-NBA club's all-time NBA alumni + active now ---- */
        function renderClub(club){
            setTitle(`${club} — NBA Alumni | ${TITLE_SUFFIX}`);
            const info = CLUBS[club] || { roster:[], city:'', country:'' };
            const loc = [info.city, info.state, info.country].filter(Boolean).join(', ');
            const flag = info.country ? flagImg(info.country) : '';
            const allTime = (info.roster||[]).map(r=>({ __k:r.player, ...r }));

            // "currently active here" — reuse the derived active index
            const activeMembers = clubIndex[club] ? [...clubIndex[club].values()] : [];
            const activeRows = activeMembers.map(m=>({
                __k:m.player, player:m.player, status:m.status,
                franchises:[...(playerFranchises[m.player]||[])].sort(),
            }));

            document.getElementById('app').innerHTML = `
                <a class="back" href="teams.html">← All teams</a>
                <div class="detail-title">${esc(club)}</div>
                <div class="detail-sub">${flag}${loc?esc(loc)+' · ':''}${info.count||allTime.length} all-time NBA alumni${info.truncated?' (showing first '+allTime.length+')':''}</div>
                ${activeRows.length ? `<div class="section"><div class="section-h">Currently active here (${activeRows.length})</div><div id="clubActive"></div></div>` : ''}
                <div class="section"><div class="section-h">All-time NBA alumni</div><div id="clubAll"></div></div>
                ${renderRelated(info.related)}`;

            if (activeRows.length){
                mountTable(document.getElementById('clubActive'), {
                    unit:'players', rows:activeRows,
                    columns:[
                        { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap',
                          cell:r=>`<a class="link" href="${playerHref(r.player)}">${esc(r.player)}</a>` },
                        { label:'Status', sortVal:r=>STATUS_RANK[r.status], cell:statusCell },
                        { label:'NBA franchises', sortVal:r=>r.franchises[0]?.toLowerCase()||'', cls:'wrap',
                          cell:r=>`<span class="fr-links">${r.franchises.map(f=>
                              `<a href="${teamHref(f)}">${esc(f)}</a>`).join(', ')||'—'}</span>` },
                    ],
                });
            }

            mountTable(document.getElementById('clubAll'), {
                unit:'players', rows:allTime,
                filterPlaceholder:'Filter players…',
                filter:(r,q)=>r.player.toLowerCase().includes(q),
                columns:[
                    { label:'Player', sortVal:r=>r.player.toLowerCase(), cls:'wrap',
                      cell:r=>`<a class="link" href="${playerHref(r.player)}">${esc(r.player)}</a>` },
                    { label:'Years', sortVal:r=>startYear(r.years), cls:'mono', cell:r=>esc(r.years) },
                    { label:'Status', sortVal:r=>STATUS_RANK[r.status], cell:statusCell },
                ],
            });
        }

        /* ---- global player search (top + bottom), same behavior as index --- */
        function initSearch(){
            wireSearch('topSearch', 'topResults');
            wireSearch('botSearch', 'botResults');
        }
        function wireSearch(inputId, resultsId){
            const input = document.getElementById(inputId);
            const box = document.getElementById(resultsId);
            let active = -1, items = [];
            const close = () => { box.classList.remove('show'); box.innerHTML=''; active=-1; items=[]; };
            const go = name => { window.location.href = playerHref(name); };
            input.addEventListener('input', ()=>{
                const q = input.value.toLowerCase().trim();
                if (q.length < 2) return close();
                items = ALL_PLAYERS.filter(n=>n.toLowerCase().includes(q)).sort((a,b)=>{
                    const as=a.toLowerCase().startsWith(q), bs=b.toLowerCase().startsWith(q);
                    if (as&&!bs) return -1; if (!as&&bs) return 1; return a.localeCompare(b);
                }).slice(0,10);
                active = -1;
                box.innerHTML = items.length
                    ? items.map((n,i)=>`<div class="sresult-item" data-i="${i}">${esc(n)}</div>`).join('')
                    : '<div class="sresult-item" style="color:var(--text-secondary)">No players found</div>';
                box.classList.add('show');
                box.querySelectorAll('.sresult-item[data-i]').forEach(el=>{
                    el.addEventListener('mousedown', e=>{ e.preventDefault(); go(items[+el.dataset.i]); });
                });
            });
            input.addEventListener('keydown', e=>{
                if (!items.length) return;
                if (e.key==='ArrowDown'){ e.preventDefault(); active=Math.min(active+1,items.length-1); }
                else if (e.key==='ArrowUp'){ e.preventDefault(); active=Math.max(active-1,0); }
                else if (e.key==='Enter'){ e.preventDefault(); go(items[active<0?0:active]); return; }
                else if (e.key==='Escape'){ return close(); }
                else return;
                box.querySelectorAll('.sresult-item').forEach((el,i)=>el.classList.toggle('active', i===active));
            });
            input.addEventListener('blur', ()=> setTimeout(close, 120));
        }

        load();
    </script>
</body>
</html>
