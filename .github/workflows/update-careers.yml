name: Update NBA Career Database

# Schedule (all times UTC):
#   In-season  (October–June): daily at 08:00
#   Off-season (July–September): weekly on Mondays at 08:00
# Cron month/day-of-week fields express the seasonal split natively, so no
# in-job date guard is needed.
on:
  schedule:
    - cron: "0 8 * 10,11,12,1,2,3,4,5,6 *"   # in-season: every day, Oct–Jun
    - cron: "0 8 * 7,8,9 1"                   # off-season: Mondays, Jul–Sep
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        type: choice
        default: incremental
        options:
          - incremental        # add roster newcomers + refresh stale active players
          - full               # refresh all active players
          - single             # refresh one player (set 'player')
          - review             # resolve locations for teams_needing_review
      player:
        description: "Player name (only for mode=single)"
        type: string
        required: false
      max_requests:
        description: "Max Wikipedia requests this run"
        type: string
        default: "100"

concurrency:
  group: update-careers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run career update
        run: |
          python3 scripts/update_careers.py \
            --mode "${{ github.event.inputs.mode || 'incremental' }}" \
            --player "${{ github.event.inputs.player || '' }}" \
            --max-requests "${{ github.event.inputs.max_requests || '100' }}" \
            --delay 1.0

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs nba_players_careers_READY.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MSG="$(cat logs/last_commit_message.txt 2>/dev/null || echo 'Auto-update career database')"
          git commit -m "$MSG"
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push failed, retry $i"; sleep $((2 ** i))
          done
