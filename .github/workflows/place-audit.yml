name: Audit queued club places

# Manual, read-only. Asks Wikipedia about every club still waiting for a
# location and reports how many the sports-club guard in _discover_location
# would refuse, with the articles behind the refusals so the guard can be
# judged too strict or not. Writes nothing to the repository.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Audit only the first N queued clubs (0 = all)"
        type: string
        default: "0"
      max_requests:
        description: "Max Wikipedia requests this run"
        type: string
        default: "300"

concurrency:
  group: update-careers          # never run alongside the daily career update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Audit
        run: |
          python3 scripts/audit_queued_places.py \
            --limit "${{ inputs.limit }}" \
            --max-requests "${{ inputs.max_requests }}" --delay 0.3 \
            | tee /tmp/place-audit.log
      - name: Summarise
        if: always()
        run: |
          { echo '### Queued club place audit'; echo '```'; \
            tail -c 60000 /tmp/place-audit.log; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queued-place-audit
          path: logs/queued_place_audit.json
          if-no-files-found: warn
