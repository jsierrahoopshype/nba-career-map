<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Standalone share/entry page for the quiz. This exists because
         social platforms fetch the shared URL's static HTML for link
         previews: ?view=quiz is a query param on index.html, so sharing it
         surfaced the HOMEPAGE's Open Graph tags. This page carries
         quiz-specific tags, then immediately hands humans to the app
         (?quizdirect=1 opens the quiz without bouncing back here --
         index.html redirects plain ?view=quiz TO this page, so the
         distinct param is the loop-breaker). Crawlers don't run JS; they
         read the tags below and stop. -->
    <title>NBA Career Map Quiz: how many players can you identify by their journey?</title>
    <meta name="description" content="The route is shown, the name isn't. Guess NBA players from their career journey — how long can you last?">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NBA Career Map">
    <meta property="og:title" content="NBA Career Map Quiz: how many players can you identify by their journey?">
    <meta property="og:description" content="The route is shown, the name isn't. Guess NBA players from their career journey — how long can you last?">
    <meta property="og:url" content="https://hoopsmatic.com/nba-career-map/quiz.html">
    <meta property="og:image" content="https://hoopsmatic.com/nba-career-map/assets/og-quiz.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NBA Career Map Quiz: how many players can you identify by their journey?">
    <meta name="twitter:description" content="The route is shown, the name isn't. Guess NBA players from their career journey — how long can you last?">
    <meta name="twitter:image" content="https://hoopsmatic.com/nba-career-map/assets/og-quiz.png">

    <script>location.replace('index.html?quizdirect=1');</script>
    <style>
        body { margin: 0; background: #0a0a0a; color: #ccc; font-family: Arial, sans-serif;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        a { color: #f0b429; }
    </style>
</head>
<body>
    <noscript><p><a href="index.html?quizdirect=1">Play the NBA Career Map Quiz</a></p></noscript>
</body>
</html>
