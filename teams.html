<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Teams | HoopsHype Career Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Design tokens mirrored from index.html (nba-polymarket palette). */
        :root {
            --page:#f5f5f7; --surface:#fff; --surface-hover:#f0f0f2; --border:#d1d1d6;
            --text:#1d1d1f; --text-secondary:#6e6e73; --accent:#3b82f6;
            --accent-dim:rgba(59,130,246,.15); --green:#1d8a40; --red:#d12c2c; --orange:#b26b00;
            --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--page); color:var(--text); line-height:1.5;
            -webkit-font-smoothing:antialiased;
        }
        a { color:inherit; text-decoration:none; }

        header {
            background:#fff; padding:14px 20px; position:sticky; top:0; z-index:100;
            box-shadow:0 2px 20px rgba(0,0,0,0.08);
        }
        .header-inner {
            max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:16px;
        }
        .logo-text {
            font-weight:700; font-size:16px; letter-spacing:-0.5px; text-transform:uppercase;
        }
        .nav { margin-left:auto; display:flex; align-items:center; gap:8px; }
        .nav a {
            padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600;
            color:var(--text-secondary); transition:all .15s ease;
        }
        .nav a:hover { background:var(--surface-hover); color:var(--text); }
        .nav a.active { color:var(--accent); background:var(--accent-dim); }

        main { max-width:1200px; margin:0 auto; padding:24px 20px 64px; }

        /* --- team grid (landing) --- */
        .page-title { font-size:24px; font-weight:700; letter-spacing:-0.5px; margin-bottom:4px; }
        .page-sub { color:var(--text-secondary); font-size:14px; margin-bottom:20px; }
        .grid {
            display:grid; gap:12px;
            grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
        }
        .team-card {
            background:var(--surface); border:1px solid var(--border); border-radius:12px;
            padding:16px; cursor:pointer; transition:all .15s ease;
            display:flex; flex-direction:column; gap:6px;
            text-decoration:none; color:inherit;
        }
        .team-card:hover { border-color:var(--accent); box-shadow:0 4px 16px rgba(0,0,0,.06); transform:translateY(-1px); }
        .team-card .name { font-weight:700; font-size:15px; }
        .team-card .meta { color:var(--text-secondary); font-size:13px; font-family:var(--mono); }
        .team-card .reloc { color:var(--accent); font-size:12px; }

        /* --- detail --- */
        .back { display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary);
                font-size:14px; font-weight:600; margin-bottom:16px; }
        .back:hover { color:var(--text); }
        .detail-title { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
        .detail-sub { color:var(--text-secondary); font-size:14px; margin:2px 0 20px; font-family:var(--mono); }

        .section { margin-bottom:28px; }
        .section-h { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
                     color:var(--text-secondary); margin-bottom:12px; }

        /* timeline */
        .timeline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .tl-node {
            background:var(--surface); border:1px solid var(--border); border-radius:999px;
            padding:6px 14px; font-size:13px; font-weight:600;
        }
        .tl-node.current { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
        .tl-node .yrs { font-family:var(--mono); color:var(--text-secondary); font-weight:400; margin-left:6px; }
        .tl-node.current .yrs { color:var(--accent); }
        .tl-arrow { color:var(--text-secondary); font-size:16px; }

        /* active-elsewhere chips */
        .chips { display:flex; flex-wrap:wrap; gap:8px; }
        .chip {
            display:inline-flex; align-items:center; gap:8px; background:var(--surface);
            border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:13px;
        }
        .chip .who { font-weight:600; }
        .chip .where { color:var(--text-secondary); }
        .dot { width:8px; height:8px; border-radius:50%; flex:none; }
        .dot.nba_active { background:var(--green); }
        .dot.overseas_active { background:var(--accent); }
        .status-badge {
            font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 8px;
            border-radius:6px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap;
        }
        .status-badge.nba_active { color:var(--green); background:rgba(29,138,64,.12); }
        .status-badge.overseas_active { color:var(--accent); background:var(--accent-dim); }
        .status-badge.retired { color:var(--text-secondary); background:var(--surface-hover); }

        /* roster table */
        .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
        #filter {
            flex:1; min-width:180px; max-width:320px; padding:9px 12px; font-size:14px;
            font-family:inherit; border:2px solid var(--border); border-radius:8px; outline:none;
            background:var(--surface-hover);
        }
        #filter:focus { border-color:var(--accent); background:#fff; }
        .count { color:var(--text-secondary); font-size:13px; font-family:var(--mono); }
        .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
        td.player { white-space:normal; }
        th {
            position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none;
            font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-secondary);
            font-weight:700;
        }
        th:hover { color:var(--text); }
        th .arrow { opacity:.4; font-size:10px; margin-left:4px; }
        th.sorted .arrow { opacity:1; color:var(--accent); }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover { background:var(--surface-hover); }
        td.years { font-family:var(--mono); color:var(--text-secondary); }
        .era-tag { font-size:12px; color:var(--text-secondary); }
        .empty { padding:40px; text-align:center; color:var(--text-secondary); }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a class="logo-text" href="index.html">🏀 Career Map</a>
            <nav class="nav">
                <a href="index.html">Map</a>
                <a href="teams.html" class="active">Teams</a>
            </nav>
        </div>
    </header>
    <main id="app"><div class="empty">Loading teams…</div></main>

    <script>
        const STATUS_LABEL = { nba_active:'NBA', overseas_active:'Overseas', retired:'Retired' };
        let TEAMS = {};
        let sortState = { key:'player', dir:1 };

        function startYear(years){
            const m = String(years||'').match(/\d{4}/);
            return m ? parseInt(m[0],10) : 0;
        }
        // sort rank so active players surface first when sorting by status
        const STATUS_RANK = { nba_active:0, overseas_active:1, retired:2 };
        const esc = s => String(s??'').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function load(){
            try {
                const res = await fetch('data/team_pages.json');
                TEAMS = (await res.json()).teams || {};
            } catch(e){
                document.getElementById('app').innerHTML =
                    '<div class="empty">Could not load team data.</div>';
                return;
            }
            route();
        }

        function route(){
            const m = location.hash.match(/^#team=(.+)$/);
            const name = m ? decodeURIComponent(m[1]) : null;
            if (name && TEAMS[name]) renderTeam(TEAMS[name]);
            else renderGrid();
            window.scrollTo(0,0);
        }

        function renderGrid(){
            const names = Object.keys(TEAMS).sort();
            const cards = names.map(n => {
                const t = TEAMS[n];
                const reloc = (t.relocations && t.relocations.length)
                    ? `<span class="reloc">↳ ${t.relocations.length} name/city eras</span>` : '';
                return `<a class="team-card" href="#team=${encodeURIComponent(n)}">
                    <span class="name">${esc(n)}</span>
                    <span class="meta">${t.alumni_count} alumni · ${t.roster_count} stints</span>
                    ${reloc}
                </a>`;
            }).join('');
            document.getElementById('app').innerHTML = `
                <div class="page-title">NBA Franchises</div>
                <div class="page-sub">30 teams · every player who ever suited up, across all eras. Pick a team.</div>
                <div class="grid">${cards}</div>`;
        }

        function renderTimeline(relocations){
            if (!relocations || !relocations.length) return '';
            const nodes = relocations.map(r => {
                const s = r.start_year ?? '';
                const e = r.end_year ?? 'present';
                const span = r.start_year==null ? `until ${e}` : `${s}–${e}`;
                return `<span class="tl-node${r.current?' current':''}">${esc(r.name)}<span class="yrs">${span}</span></span>`;
            }).join('<span class="tl-arrow">→</span>');
            return `<div class="section">
                <div class="section-h">Franchise history</div>
                <div class="timeline">${nodes}</div>
            </div>`;
        }

        function renderActiveElsewhere(list){
            if (!list || !list.length) return '';
            const chips = list.map(a => {
                const where = a.status==='overseas_active'
                    ? `${esc(a.current_team)}${a.country?' · '+esc(a.country):''}`
                    : esc(a.current_team);
                return `<span class="chip">
                    <span class="dot ${a.status}"></span>
                    <span class="who">${esc(a.player)}</span>
                    <span class="where">${where}</span>
                </span>`;
            }).join('');
            return `<div class="section">
                <div class="section-h">Currently active elsewhere (${list.length})</div>
                <div class="chips">${chips}</div>
            </div>`;
        }

        function renderTeam(t){
            const relocSub = (t.relocations && t.relocations.length)
                ? t.relocations.map(r=>r.name).join(' → ') : '';
            document.getElementById('app').innerHTML = `
                <a class="back" href="teams.html">← All teams</a>
                <div class="detail-title">${esc(t.franchise)}</div>
                <div class="detail-sub">${t.alumni_count} alumni · ${t.roster_count} stints${relocSub?' · '+esc(relocSub):''}</div>
                ${renderTimeline(t.relocations)}
                ${renderActiveElsewhere(t.active_elsewhere)}
                <div class="section">
                    <div class="section-h">All-time alumni</div>
                    <div class="toolbar">
                        <input id="filter" type="text" placeholder="Filter players…" autocomplete="off">
                        <span class="count" id="rowCount"></span>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr>
                                <th data-key="player">Player <span class="arrow">▲</span></th>
                                <th data-key="years">Years <span class="arrow">▲</span></th>
                                <th data-key="stint_team">Era name <span class="arrow">▲</span></th>
                                <th data-key="status">Status <span class="arrow">▲</span></th>
                            </tr></thead>
                            <tbody id="rosterBody"></tbody>
                        </table>
                    </div>
                </div>`;
            sortState = { key:'player', dir:1 };
            const rows = t.roster.slice();
            drawRoster(rows);

            document.querySelectorAll('th[data-key]').forEach(th => {
                th.addEventListener('click', () => {
                    const k = th.dataset.key;
                    sortState.dir = (sortState.key===k) ? -sortState.dir : 1;
                    sortState.key = k;
                    drawRoster(rows);
                });
            });
            document.getElementById('filter').addEventListener('input', () => drawRoster(rows));
        }

        function drawRoster(rows){
            const q = (document.getElementById('filter').value||'').toLowerCase().trim();
            const { key, dir } = sortState;
            const filtered = q ? rows.filter(r => r.player.toLowerCase().includes(q)) : rows;
            const sorted = filtered.slice().sort((a,b) => {
                let av, bv;
                if (key==='years'){ av=startYear(a.years); bv=startYear(b.years); }
                else if (key==='status'){ av=STATUS_RANK[a.status]; bv=STATUS_RANK[b.status]; }
                else { av=(a[key]||'').toLowerCase(); bv=(b[key]||'').toLowerCase(); }
                if (av<bv) return -1*dir;
                if (av>bv) return 1*dir;
                // stable tiebreak by player name
                return a.player.localeCompare(b.player);
            });
            document.getElementById('rosterBody').innerHTML = sorted.map(r => `
                <tr>
                    <td class="player">${esc(r.player)}</td>
                    <td class="years">${esc(r.years)}</td>
                    <td class="era-tag">${esc(r.stint_team)}</td>
                    <td><span class="status-badge ${r.status}">${STATUS_LABEL[r.status]||esc(r.status)}</span></td>
                </tr>`).join('') || `<tr><td colspan="4" class="empty">No players match "${esc(q)}".</td></tr>`;
            document.getElementById('rowCount').textContent =
                `${sorted.length} of ${rows.length} stints`;
            document.querySelectorAll('th[data-key]').forEach(th => {
                const on = th.dataset.key===key;
                th.classList.toggle('sorted', on);
                const arrow = th.querySelector('.arrow');
                if (arrow) arrow.textContent = on ? (dir>0?'▲':'▼') : '▲';
            });
        }

        window.addEventListener('hashchange', route);
        load();
    </script>
</body>
</html>
