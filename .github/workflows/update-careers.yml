name: Update NBA Career Database

# Schedule (all times UTC):
#   Daily, year-round, at 08:00                     -> incremental
#   Monthly (1st of every month 09:00)              -> full_overseas
# Latest Signings depends on daily transaction capture, so the pipeline no
# longer drops to weekly in the off-season (Jul-Sep) -- daily runs still find
# real moves (overseas signings, G League call-ups) even outside the NBA
# season proper. The run step maps the monthly cron to the full_overseas
# mode (re-check ALL overseas players); the daily cron uses incremental.
on:
  schedule:
    - cron: "0 8 * * *"                       # daily, every day of the year
    - cron: "0 9 1 * *"                       # monthly: full overseas re-check
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        type: choice
        default: incremental
        options:
          - incremental        # roster newcomers + dropped + all overseas + stale NBA
          - full               # refresh all active players (NBA + overseas)
          - full_overseas      # re-check ALL overseas_active players
          - single             # refresh one player (set 'player')
          - review             # resolve locations for teams_needing_review
      player:
        description: "Player name (only for mode=single)"
        type: string
        required: false
      max_requests:
        description: "Max Wikipedia requests this run"
        type: string
        default: "650"

concurrency:
  group: update-careers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run career update
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_PLAYER: ${{ github.event.inputs.player }}
          IN_MAX: ${{ github.event.inputs.max_requests }}
          # Incoming webhook for the #signings Slack notification (see
          # _notify_slack in update_careers.py). Read from the environment
          # only, never hardcoded or logged.
          SLACK_SIGNINGS_WEBHOOK: ${{ secrets.SLACK_SIGNINGS_WEBHOOK }}
        run: |
          # Resolve the run mode: manual dispatch uses the chosen input; the
          # monthly cron runs full_overseas; every other schedule runs incremental.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${IN_MODE:-incremental}"
          elif [ "$SCHEDULE" = "0 9 1 * *" ]; then
            MODE="full_overseas"
          else
            MODE="incremental"
          fi
          echo "Resolved mode: $MODE (event=$EVENT_NAME schedule='$SCHEDULE')"
          python3 scripts/update_careers.py \
            --mode "$MODE" \
            --player "${IN_PLAYER:-}" \
            --max-requests "${IN_MAX:-650}" \
            --delay 1.0

      - name: Refresh player birth/death facts
        # Incremental by design: the players missing from
        # data/players/player_bio.json, plus a slice of the living ones whose
        # record is over a week old so a death is picked up within the week.
        # After the first backfill (run .github/workflows/player-bio.yml by
        # hand once) that is a few hundred records and a handful of requests.
        #
        # continue-on-error: the script refuses to write anything when
        # Wikidata cannot be reached (it exits 1 rather than emptying the
        # file), and a Wikidata outage must not throw away the career update
        # this run just did. The step still goes red, so the failure is
        # visible in the run.
        continue-on-error: true
        run: |
          python3 scripts/fetch_bio_wikidata.py \
            --refresh-limit 1000 \
            --delay 1.0

      - name: Rebuild dashboard data
        # Consolidated aggregation layer for the dashboard. Runs every pipeline
        # run so data/dashboard_data.json stays fresh; reads the just-updated
        # career DB + transaction ledger and is committed with the rest of /data.
        run: python3 scripts/build_dashboard_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # player/, team/ and country/ carry the prerendered pages written by
          # build_dashboard_data.py, and assets/ the per-player OG cards;
          # without them they are generated every run and committed never.
          git add data logs nba_players_careers_READY.json sitemap.xml \
                  player team country assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MSG="$(cat logs/last_commit_message.txt 2>/dev/null || echo 'Auto-update career database')"
          git commit -m "$MSG"
          # Same as the audit workflow: a push that never lands is a failed
          # run, not a quiet one.
          pushed=
          for i in 1 2 3 4; do
            if git push; then pushed=yes; break; fi
            echo "push failed, retry $i"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((2 ** i))
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push the update"
            exit 1
          fi
